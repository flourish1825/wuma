name: 构建并发布网站

on:
  push:
    branches: [main]
    paths: ["entries/**", "summaries/**", "web/**", "config.json", "scripts/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 始终取默认分支的最新提交，否则由 Issue/定时任务调用时会拿到触发时的旧版本
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
