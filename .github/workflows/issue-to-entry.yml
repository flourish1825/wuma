name: 日记入库

on:
  issues:
    types: [opened]

concurrency:
  group: diary-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  add-entry:
    if: contains(github.event.issue.labels.*.name, 'diary')
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - id: parse
        run: python scripts/issue_to_entry.py

      - name: 提交到仓库
        if: steps.parse.outputs.status == 'ok'
        run: |
          git config user.name "diary-bot"
          git config user.email "diary-bot@users.noreply.github.com"
          git add entries
          git commit -m "diary: ${{ steps.parse.outputs.path }}"
          git pull --rebase
          git push

      - name: 回复并关闭 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          MSG: ${{ steps.parse.outputs.message }}
          STATUS: ${{ steps.parse.outputs.status }}
        run: |
          gh issue comment "$NUM" --body "$MSG"
          if [ "$STATUS" = "ok" ]; then
            gh issue close "$NUM" --reason completed
          else
            gh issue close "$NUM" --reason "not planned"
          fi

  deploy:
    needs: add-entry
    if: needs.add-entry.outputs.status == 'ok'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml
